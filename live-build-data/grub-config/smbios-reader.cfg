# SMBIOS cmdline reader, LIVE/ISO copy. NOT shipped by default: opt-in, and
# 3600_convert-raw-to-iso appends this file into config.cfg only under
# '--smbios-reader true', then removes it. A released ISO carries no reader at
# all -- there is no code path for a firmware-level attacker to reach, which no
# in-image test on firmware-supplied data could give (all of it is
# attacker-controllable by definition).
#
# Appended to config.cfg, which grub.cfg sources at its top, so
# ${dm_smbios_extra} is set at parse time before any menuentry is booted. It lets
# a boot-tester inject extra kernel cmdline through the real firmware -> GRUB ->
# kernel chain via 'qemu -smbios' ('dm-qemu --smbios-append') with no image edit.
# The matching '${dm_smbios_extra}' placeholder on the live kernel lines comes
# from 3600's --bootappend-live, under the same build option.
#
# Read the SMBIOS Type 1 system serial number (qemu -smbios
# type=1,serial=dm-cmdline=...; offset 7 is a real string-reference field GRUB can
# read -- Type 11 OEM strings have no such field, offset 5 is past the 5-byte
# formatted area and faults) and, if it carries the 'dm-cmdline=' sentinel, expose
# the rest as ${dm_smbios_extra}. With no SMBIOS string set the reader is a no-op
# and ${dm_smbios_extra} stays empty.
#
# Kept in step with vm-config-dist etc/grub.d/01_smbios-reader, the DISK path's
# copy of this reader. Two parallel implementations: change both or they drift.
# dm-grub-smbios-tests asserts they are identical.
#
# Second layer, for an image that IS built with the reader: the serial number is
# only read when SMBIOS Type 1 Manufacturer (offset 4) says QEMU. Everywhere else
# the reader is inert. This does not stop a firmware-level attacker (the same
# vendor DMI tool sets Manufacturer), but it forces the machine to report itself
# as a QEMU guest to dmidecode, systemd-detect-virt and every inventory system,
# instead of hiding in a field nobody reads. Detectability, not a boundary -- the
# boundary is that released images do not carry this file's contents at all.
#
# Manufacturer, not Product Name or the Type 0 BIOS vendor: qemu marks "QEMU" a
# guest ABI constant (hw/i386/fw_cfg.c) and leaves it alone when only 'serial=' is
# passed, so it holds across SeaBIOS and OVMF, i440fx and q35, amd64 and arm64.
# Product Name carries the machine type and Type 0 vendor differs per firmware, so
# either would break a boot-test leg on a machine type nobody thought about.
# Reading Manufacturer FIRST also keeps a BARE-METAL boot quiet: DSP0134 requires
# Manufacturer to be non-null but leaves the serial number optional, and GRUB prints
# 'error: failed to retrieve the structure field.' for an absent string. Under QEMU
# the gate passes, so that alone is not enough -- the serial-index check inside the
# gate is what keeps an ordinary QEMU boot quiet.
# dm-smbios-reader: begin
insmod regexp
insmod smbios
# Explicit rather than relying on command.lst autoloading the serial command below.
insmod serial
# Cleared first: 'smbios' and 'regexp' leave these untouched when they find no match,
# so a value surviving from an earlier load_env would select the tester path on an
# ordinary boot.
set dm_smbios_vendor=
set dm_smbios_serial_index=0
set dm_smbios_oem=
set dm_smbios_extra=
# Nothing below runs off QEMU: the serial number is only consulted once the
# manufacturer identifies a QEMU guest.
smbios --type 1 --get-string 4 --set dm_smbios_vendor
if [ "${dm_smbios_vendor}" = "QEMU" ]; then
    # Offset 7 holds a string INDEX, and 0 means "no string" (DSP0134 6.1.3).
    # Asking for the string when the index is 0 makes GRUB print 'error: failed to
    # retrieve the structure field.' on the console -- which is EVERY ordinary boot
    # of an image built with the reader, because the serial is set only when a
    # tester injects. Reading the index byte first never errors, so the noisy call
    # happens only when there is something to read.
    smbios --type 1 --get-byte 7 --set dm_smbios_serial_index
    if [ "${dm_smbios_serial_index}" != "0" ]; then
        smbios --type 1 --get-string 7 --set dm_smbios_oem
        regexp --set 1:dm_smbios_extra "^dm-cmdline=(.*)" "${dm_smbios_oem}"
    fi
fi
# Route GRUB to the serial console ONLY when a boot-tester injected a cmdline via
# SMBIOS (dm_smbios_extra non-empty), so the headless firmware -> GRUB -> kernel
# test sees the boot. A normal boot (no injection) keeps the graphical gfxterm
# menu config.cfg set up -- the code path is chosen on the SMBIOS variable, so the
# interactive boot experience does not change.
# 'terminal_output serial console' below keeps 'console' deliberately.
# serial-console-enable's etc/default/grub.d/30_serial_console.cfg argues against
# pairing them, but that file sets GRUB_TERMINAL -- input AND output, on every
# boot, on real hardware -- where duplicated output and a serial-input hijack of
# the menu both matter. This sets OUTPUT only, on the injection-only test path,
# and never takes serial input. Keeping 'console' leaves video output working if
# serial init fails, and the EFI mirroring that file warns about would garble the
# harness log LOUDLY rather than silently.
if [ -n "${dm_smbios_extra}" ]; then
    serial --unit=0 --speed=115200 --word=8 --parity=no --stop=1
    terminal_output serial console
    # Boot the default entry immediately. The boot-tester drives the guest over
    # the serial ROOT shell and selects the session via SMBIOS-append, NOT the
    # GRUB menu -- and taking serial INPUT / waiting at the menu let the harness
    # connection cancel the countdown, so GRUB hung at the menu. timeout=0 boots
    # straight through (no menu, no input); a normal boot keeps config.cfg's
    # timeout=30.
    set timeout=0
fi
# dm-smbios-reader: end
