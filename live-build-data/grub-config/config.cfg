set default=0
set timeout=30

# Do not attempt to resolve font loading issues here, you *will* break the
# boot menu in various weird ways if you try.
if [ x$feature_default_font_path = xy ] ; then
    font=unicode
else
    font=$prefix/unicode.pf2
fi

# Copied from the netinst image
if loadfont $font ; then
    set gfxmode=800x600
    set gfxpayload=keep
    insmod efi_gop
    insmod efi_uga
    insmod video_bochs
    insmod video_cirrus
else
    set gfxmode=auto
    insmod all_video
fi

insmod gfxterm
insmod png

source /boot/grub/theme.cfg

terminal_output gfxterm

insmod play
play 960 440 1 0 4 440 1

# The SMBIOS cmdline reader is opt-in and lives in smbios-reader.cfg beside this
# file. 3600_convert-raw-to-iso appends it here only under '--smbios-reader true',
# so a released ISO carries no reader. Appending rather than sourcing keeps the
# ISO free of a stray config fragment.
