set default=0
set timeout=30

# Do not attempt to resolve font loading issues here, you *will* break the
# boot menu in various weird ways if you try.
if [ x$feature_default_font_path = xy ] ; then
    font=unicode
else
    font=$prefix/unicode.pf2
fi

# Copied from the netinst image
if loadfont $font ; then
    set gfxmode=800x600
    set gfxpayload=keep
    insmod efi_gop
    insmod efi_uga
    insmod video_bochs
    insmod video_cirrus
else
    set gfxmode=auto
    insmod all_video
fi

insmod gfxterm
insmod png

source /boot/grub/theme.cfg

terminal_output gfxterm

insmod play
play 960 440 1 0 4 440 1

# SMBIOS cmdline reader. Runs at parse time (config.cfg is sourced at the top of
# grub.cfg), so ${dm_smbios_extra} is set before any menuentry is booted. It lets
# a boot-tester inject extra kernel cmdline through the real firmware -> GRUB ->
# kernel chain via 'qemu -smbios' ('dm-qemu --smbios-append') with no image edit.
# Read the SMBIOS Type 1 system serial number (qemu -smbios
# type=1,serial=dm-cmdline=...; offset 7 is a real string-reference field GRUB can
# read -- Type 11 OEM strings have no such field, offset 5 is past the 5-byte
# formatted area and faults) and, if it carries the 'dm-cmdline=' sentinel, expose
# the rest as ${dm_smbios_extra}, which the generated live 'linux' lines append.
# With no SMBIOS string set the reader is a no-op and ${dm_smbios_extra} stays
# empty. Shipped in-generation (no post-generation grub.cfg edit).
# Kept in step with vm-config-dist etc/grub.d/01_smbios-reader, the DISK path's copy
# of this reader. Two parallel implementations: change both or they drift.
insmod regexp
insmod smbios
# Explicit rather than relying on command.lst autoloading the serial command below.
insmod serial
# Cleared first: 'smbios' and 'regexp' leave these untouched when they find no match,
# so a value surviving from an earlier load_env would select the tester path on an
# ordinary boot.
set dm_smbios_oem=
set dm_smbios_extra=
smbios --type 1 --get-string 7 --set dm_smbios_oem
regexp --set 1:dm_smbios_extra "^dm-cmdline=(.*)" "${dm_smbios_oem}"

# Route GRUB to the serial console ONLY when a boot-tester injected a cmdline via
# SMBIOS (dm_smbios_extra non-empty), so the headless firmware -> GRUB -> kernel
# test sees the boot. A normal boot (no injection) keeps the graphical gfxterm
# menu above untouched -- the code path is chosen on the SMBIOS variable, so the
# interactive boot experience does not change.
# 'terminal_output serial console' below keeps 'console' deliberately.
# serial-console-enable's etc/default/grub.d/30_serial_console.cfg argues against
# pairing them, but that file sets GRUB_TERMINAL -- input AND output, on every
# boot, on real hardware -- where duplicated output and a serial-input hijack of
# the menu both matter. This sets OUTPUT only, on the injection-only test path,
# and never takes serial input. Keeping 'console' leaves video output working if
# serial init fails, and the EFI mirroring that file warns about would garble the
# harness log LOUDLY rather than silently.
if [ -n "${dm_smbios_extra}" ]; then
    serial --unit=0 --speed=115200 --word=8 --parity=no --stop=1
    terminal_output serial console
    # Boot the default entry immediately. The boot-tester drives the guest over
    # the serial ROOT shell and selects the session via SMBIOS-append, NOT the
    # GRUB menu -- and taking serial INPUT / waiting at the menu let the harness
    # connection cancel the countdown, so GRUB hung at the menu. timeout=0 boots
    # straight through (no menu, no input); a normal boot keeps timeout=30 above.
    set timeout=0
fi
