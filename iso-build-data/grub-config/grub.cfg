source /boot/grub/config.cfg

menuentry "LIVE Mode | USER Session | disposable use" --hotkey=l {
  linux /live/vmlinuz @APPEND_LIVE@
  initrd /live/initrd.img
}

menuentry "LIVE Mode | SYSMAINT Session | system maintenance, install" {
  linux /live/vmlinuz @APPEND_LIVE@ systemd.unit=sysmaint-boot.target boot-role=sysmaint
  initrd /live/initrd.img
}

menuentry "LIVE Mode | UNRESTRICTED Session | system recovery, install" {
  linux /live/vmlinuz @APPEND_LIVE@ boot-role=unrestricted-admin
  initrd /live/initrd.img
}

submenu 'Persistent (Advanced Users Only)...' --hotkey=p {
  source /boot/grub/theme.cfg

  menuentry "NOTE: /boot (bootloader, kernel, initramfs) remains non-persistent due to technical limitation" {
    echo "Persistent mode keeps a full-root read-write overlay on a second disk you must"
    echo "provision first (in a live session, run: sudo persistence-setup)."
    echo ""
    echo "/boot (bootloader, kernel, initramfs) stays NON-persistent due to a technical"
    echo "limitation: kernel, initramfs and GRUB upgrades will NOT take effect in live mode."
    echo "Reflash the medium or install to disk for those."
    echo ""
    echo "If no persistence volume is found the system boots amnesic (changes lost on"
    echo "reboot); systemcheck warns about this after login."
    echo ""
    echo "Press Enter to return to the menu..."
    read
  }

  menuentry "PERSISTENT Mode | USER Session | daily use" --hotkey=u {
    linux /live/vmlinuz @APPEND_LIVE@ @APPEND_PERSISTENCE@
    initrd /live/initrd.img
  }

  menuentry "PERSISTENT Mode | SYSMAINT Session | system maintenance, install" {
    linux /live/vmlinuz @APPEND_LIVE@ @APPEND_PERSISTENCE@ systemd.unit=sysmaint-boot.target boot-role=sysmaint
    initrd /live/initrd.img
  }

  menuentry "PERSISTENT Mode | UNRESTRICTED Session | system recovery, install" {
    linux /live/vmlinuz @APPEND_LIVE@ @APPEND_PERSISTENCE@ boot-role=unrestricted-admin
    initrd /live/initrd.img
  }
}

submenu 'Utilities...' --hotkey=u {
  source /boot/grub/theme.cfg

  if [ "x${grub_platform}" = "xpc" ] -a [ -e /live/memtest.bin ]; then
    menuentry "Memory Diagnostic Tool (memtest86+)" --hotkey=m {
      linux /live/memtest.bin
    }
  elif [ "x${grub_platform}" = "xefi" ] -a [ -e /live/memtest.efi ]; then
    menuentry "Memory Diagnostic Tool (memtest86+)" --hotkey=m {
      linux /live/memtest.efi
    }
  fi

  if [ "x${grub_platform}" = "xefi" ]; then
    menuentry "UEFI Firmware Settings" {
      fwsetup
    }
  fi

  menuentry "Verify integrity of the boot medium" --hotkey=v {
    linux /live/vmlinuz @APPEND_LIVE@ rd.live.check
    initrd /live/initrd.img
  }
}
