source /boot/grub/config.cfg

## Updatable boot under persistence: if a provisioned overlay carries its own
## writable grub.cfg (seeded at provisioning, rewritten by the kernel postinst
## hook after an in-overlay kernel upgrade), hand off to it so the UPGRADED
## kernel boots. 'persistbootx' is the unencrypted boot area of an ENCRYPTED
## overlay (the signed grub cannot read LUKS); 'persistence' is a PLAINTEXT ext4
## overlay grub reads directly. Neither label exists on an unprovisioned stick,
## so a fresh boot falls through to the amnesic live menu below. configfile runs
## the handed-off menu and does not return; a missing/broken file falls through.
if search --no-floppy --label persistbootx --set persist_boot_dev ; then
  if [ -f ($persist_boot_dev)/boot/grub/grub.cfg ] ; then
    configfile ($persist_boot_dev)/boot/grub/grub.cfg
  fi
fi
if search --no-floppy --label persistence --set persist_boot_dev ; then
  if [ -f ($persist_boot_dev)/boot/grub/grub.cfg ] ; then
    configfile ($persist_boot_dev)/boot/grub/grub.cfg
  fi
fi

menuentry "LIVE Mode | USER Session | disposable use" --hotkey=l {
  linux /live/vmlinuz @APPEND_LIVE@
  initrd /live/initrd.img
}

menuentry "LIVE Mode | SYSMAINT Session | system maintenance, install" {
  linux /live/vmlinuz @APPEND_LIVE@ systemd.unit=sysmaint-boot.target boot-role=sysmaint
  initrd /live/initrd.img
}

menuentry "LIVE Mode | UNRESTRICTED Session | system recovery, install" {
  linux /live/vmlinuz @APPEND_LIVE@ boot-role=unrestricted-admin
  initrd /live/initrd.img
}

submenu 'Persistent (Advanced Users Only)...' --hotkey=p {
  source /boot/grub/theme.cfg

  menuentry "Note: kernel updates will not take effect in ISO persistent mode!" {
    true
  }

  submenu 'Encrypted persistence (LUKS, recommended)...' {
    source /boot/grub/theme.cfg

    menuentry "Note: boot this only with the LUKS persistence disk attached" {
      true
    }

    menuentry "PERSISTENT Mode | USER Session | daily use (encrypted)" --hotkey=u {
      linux /live/vmlinuz @APPEND_LIVE@ @APPEND_PERSISTENCE_LUKS@
      initrd /live/initrd.img
    }

    menuentry "PERSISTENT Mode | SYSMAINT Session | system maintenance, install (encrypted)" {
      linux /live/vmlinuz @APPEND_LIVE@ @APPEND_PERSISTENCE_LUKS@ systemd.unit=sysmaint-boot.target boot-role=sysmaint
      initrd /live/initrd.img
    }

    menuentry "REMOVE user-sysmaint-split (encrypted)" {
      linux /live/vmlinuz @APPEND_LIVE@ @APPEND_PERSISTENCE_LUKS@ boot-role=sysmaint systemd.unit=sysmaint-boot.target remove-sysmaint
      initrd /live/initrd.img
    }
  }

  submenu 'Plaintext persistence (unencrypted, not recommended)...' {
    source /boot/grub/theme.cfg

    menuentry "PERSISTENT Mode | USER Session | daily use (unencrypted)" --hotkey=p {
      linux /live/vmlinuz @APPEND_LIVE@ @APPEND_PERSISTENCE@
      initrd /live/initrd.img
    }

    menuentry "PERSISTENT Mode | SYSMAINT Session | system maintenance, install (unencrypted)" {
      linux /live/vmlinuz @APPEND_LIVE@ @APPEND_PERSISTENCE@ systemd.unit=sysmaint-boot.target boot-role=sysmaint
      initrd /live/initrd.img
    }

    menuentry "REMOVE user-sysmaint-split (unencrypted)" {
      linux /live/vmlinuz @APPEND_LIVE@ @APPEND_PERSISTENCE@ boot-role=sysmaint systemd.unit=sysmaint-boot.target remove-sysmaint
      initrd /live/initrd.img
    }
  }
}

submenu 'Utilities...' --hotkey=u {
  source /boot/grub/theme.cfg

  if [ "x${grub_platform}" = "xpc" ] -a [ -e /live/memtest.bin ]; then
    menuentry "Memory Diagnostic Tool (memtest86+)" --hotkey=m {
      linux /live/memtest.bin
    }
  elif [ "x${grub_platform}" = "xefi" ] -a [ -e /live/memtest.efi ]; then
    menuentry "Memory Diagnostic Tool (memtest86+)" --hotkey=m {
      linux /live/memtest.efi
    }
  fi

  if [ "x${grub_platform}" = "xefi" ]; then
    menuentry "UEFI Firmware Settings" {
      fwsetup
    }
  fi

  menuentry "Verify integrity of the boot medium" --hotkey=v {
    linux /live/vmlinuz @APPEND_LIVE@ rd.live.check
    initrd /live/initrd.img
  }
}
