## End-to-end dry-run smoke. Heavyweight (5-15 min). Invoked as a
## reusable workflow from run_automated_builder.yml so the build is
## gated on the dry-run passing in the same Actions UI run; also
## available as workflow_dispatch for ad-hoc manual smoke tests.
##
## See agents/github-actions-security.md for the standard
## permissions / persist-credentials / fork-PR / SHA-pin patterns.

name: Dry-run

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

## Concurrency: per developer-meta-files' agents/github-actions.md
## G-A-006, github.workflow inside a reusable resolves to the
## caller's workflow name. local-test-build.yml calls this file
## via `uses: ./.github/workflows/local-build-dry-run.yml` and
## carries `${{ github.workflow }}-${{ github.ref }}` itself, so a
## bare same-key here would collide with the caller and trip the
## deadlock detector ("Canceling since a deadlock was detected for
## concurrency group: ..."). The trailing literal `-dry-run` is the
## differentiator the caller does not carry, matching the codeql
## reusable's `${{ inputs.language }}` pattern.
##
## This file is `local-` prefixed (repo-private, never propagated)
## but is also dispatchable standalone via workflow_dispatch for
## ad-hoc smoke tests. The same key works in both modes:
##   called via uses:   group = "00 Run automated builder-<ref>-dry-run"
##                       caller's group = "00 Run automated builder-<ref>"
##                       different keys -> no deadlock
##   workflow_dispatch  group = "Dry-run-<ref>-dry-run"
##                       unique per ref -> standard cancel-on-push
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-dry-run
  cancel-in-progress: true

jobs:
  dry-run:
    name: derivative-maker --dry-run true
    runs-on: ubuntu-latest

    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name != 'pull_request'

    ## MUST exceed the 'timeout 3600' (60 min) inside
    ## ci/dry-run.d/300_run-derivative-maker, plus checkout and the image
    ## build/cache restore. At 25 the job was cancelled before that inner ceiling
    ## could ever fire, so a run measured at ~35 min could not have passed here.
    timeout-minutes: 75

    ## Subsequent steps run inside a privileged debian:trixie with
    ## systemd as PID 1 so 'systemctl start approx' (the build's apt
    ## cache) works. The host (ubuntu-latest) only hosts docker; a
    ## plain 'container:' block does not boot systemd inside. The
    ## launch-systemd-container composite action bakes the image and
    ## waits for systemd to become ready; subsequent steps
    ## docker-exec into the container with --workdir /workspace.
    steps:
      - name: Checkout repository (no submodules yet)
        ## submodules: false so the next steps can re-target each
        ## submodule's origin URL at the fork before init.
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          submodules: false
          fetch-depth: 0
          persist-credentials: false

      - name: Mirror Kicksecure/ and Whonix/ to ${{ github.repository_owner }}
        ## Must run BEFORE 'submodule update --init' so the rewrites
        ## are visible to the recursive clone.
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        if: github.repository_owner != 'Whonix' && github.repository_owner != 'Kicksecure'
        run: ./ci/configure-fork-mirror "${REPOSITORY_OWNER}" "${REPOSITORY_OWNER}"

      - name: Initialize submodules
        run: git submodule update --init --recursive

      - name: Check out matching fork branch in cross-org submodules (if present)
        ## head_ref on a fork PR is attacker-named; route it through
        ## an env var rather than inlining (actionlint).
        if: github.repository_owner != 'Whonix' && github.repository_owner != 'Kicksecure'
        env:
          FORK_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: ./ci/checkout-fork-submodule-branches "${FORK_BRANCH}"

      ## The dry-run must run in the SAME container the real build uses, or it
      ## cannot see the class of defect where a tool the build invokes is absent
      ## from the build image -- which is exactly how a missing 'kmod' reached
      ## production and silently degraded the reproducibility comparison.
      - name: Restore docker image cache
        id: dmimg-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.dm-docker-image
          key: ${{ runner.os }}-dryrun-dmimg-${{ hashFiles('docker/**', 'build_sources/frozen-snapshot-timestamp', 'build_sources/debian_stable_frozen_direct_clearnet.sources') }}

      - name: Load cached docker image
        if: steps.dmimg-cache.outputs.cache-hit == 'true'
        run: ./ci/dm-docker-image-cache load

      ## Builds the image through its own canonical path (which also applies the
      ## frozen-snapshot label the cache reuse is conditioned on) and exits
      ## immediately; there is no build-only entry point.
      - name: Build the derivative-maker image if not cached
        env:
          CI: "true"
        run: ./docker/derivative-maker-docker-run -- true

      - name: Save docker image to cache
        if: steps.dmimg-cache.outputs.cache-hit != 'true'
        run: ./ci/dm-docker-image-cache save

      - name: Resolve the derivative-maker image reference
        id: dmimg-ref
        ## Never spell the reference out here: docker-run, ci/dm-docker-image-cache
        ## and this workflow must all name the SAME image, and a hardcoded copy
        ## does not fail loudly -- it silently starts a different container. The
        ## helper is the single definition, and it arch-qualifies the tag.
        run: printf 'ref=%s\n' "$(./docker/derivative-maker-docker-image-ref)" >> "${GITHUB_OUTPUT}"

      - name: Start systemd container from the derivative-maker image
        ## The action layers systemd onto whatever base it is given, so it takes
        ## the build image directly.
        uses: org-ai-assisted/developer-meta-files/.github/actions/launch-systemd-container@master
        with:
          name: dryrun
          image: ${{ steps.dmimg-ref.outputs.ref }}
          wait-seconds: '90'

      - name: Run dry-run inside container
        ## --workdir /workspace: the action mounts ${{ github.workspace }}
        ## at /workspace inside the container; the dry-run script is
        ## referenced via './ci/dry-run' and needs PWD to match.
        run: docker exec --env CI=true --workdir /workspace dryrun ./ci/dry-run

      ## The lane BUILDS a real '.qcow2.libvirt.xz' and its '.dm-buildinfo' and
      ## then threw both away. Publishing them is what makes the lane's output
      ## inspectable at all -- and specifically what lets
      ## dm-repro-verify-against-ci compare a local dry-run against this one.
      ## Copied OUT of the container first: the build writes to the build user's
      ## home inside it, not to the bind-mounted workspace.
      - name: Collect the dry-run artifacts
        if: always()
        run: |
          set -o errexit
          set -o nounset
          set -o pipefail
          ## sudo for the mkdir: the privileged dryrun container ran ./ci/dry-run
          ## as ROOT in this bind-mounted workspace, so it is root-owned by now
          ## and an unprivileged mkdir fails. The workflow's own "Reclaim
          ## workspace ownership" step fixes that, but it runs LATER -- after the
          ## container is torn down, and 'docker cp' needs the container alive.
          sudo mkdir --parents dryrun-artifacts
          ## '|| true' on the copy alone, never on the assertion below: a lane
          ## that produced nothing must fail at the upload, not here.
          sudo docker cp "dryrun:/home/builder/derivative-binary/." dryrun-artifacts/ || true
          ## Hand it back before upload-artifact reads it.
          sudo chown -R "$(id -u):$(id -g)" dryrun-artifacts
          find dryrun-artifacts -type f \( -name '*.qcow2.libvirt.xz' -o -name '*.dm-buildinfo' \) -print

      - name: Upload the dry-run artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dryrun-image
          ## Only the released artifact and its provenance record. The raw build
          ## intermediates are not the subject and would bloat the upload.
          path: |
            dryrun-artifacts/**/*.qcow2.libvirt.xz
            dryrun-artifacts/**/*.dm-buildinfo
          ## An empty upload would make a lane that built nothing look like one
          ## whose artifacts simply expired.
          if-no-files-found: error
          retention-days: 7

      - name: Tear down container
        if: always()
        run: docker rm --force dryrun || true

      - name: Reclaim workspace ownership
        if: always()
        ## The privileged dryrun container ran ./ci/dry-run as root,
        ## leaving root-owned files in the bind-mounted $GITHUB_WORKSPACE.
        ## The host runner can no longer mkdir into the workspace
        ## (e.g. for actions/checkout below) until ownership is
        ## restored. Passwordless sudo is available on ubuntu-latest
        ## hosted runners.
        run: sudo chown -R "$(id -u):$(id -g)" "${GITHUB_WORKSPACE}"

      - name: Checkout dist-ai (shared CI helper binaries)
        if: always()
        ## Needed for usr/bin/step-summary-emit. derivative-maker
        ## does not vendor a copy; checkout @master keeps the org's
        ## single source of truth. Pinned SHA matches the existing
        ## actions/checkout in this file.
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          repository: org-ai-assisted/dist-ai
          ref: master
          path: .github/dist-ai
          persist-credentials: false

      - name: Emit step summary
        if: always()
        ## Headline panel for the Actions tab: outcome + image used.
        ## Detailed build/teardown output stays in the per-step logs.
        ## Template values routed through env: per
        ## developer-meta-files#87 (avoid CodeQL inline-${{...}}-
        ## in-run: flag).
        env:
          JOB_STATUS: ${{ job.status }}
          DRYRUN_IMAGE: ${{ steps.dmimg-ref.outputs.ref }}
        run: |
          ./.github/dist-ai/usr/bin/step-summary-emit \
            --tool 'Dry-run' \
            --column-header field \
            --row "outcome=${JOB_STATUS}" \
            --row "image=${DRYRUN_IMAGE}"
