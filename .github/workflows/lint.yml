---
## Offline lint checks. Runs on every PR and on tag pushes.
## Each check is a discrete workflow step so failures are visible
## in the GitHub Actions UI without scrolling. The dispatcher script
## ci/local-checks.sh reproduces the whole flow on a dev machine.
##
## See agents/github-actions-security.md for permissions /
## persist-credentials / fork-PR / SHA-pinning conventions, and for
## the rationale on why actionlint is not used.

name: Lint

on:
  pull_request:
    branches: [master]
  ## Branch-push triggers intentionally omitted: a tag-bearing commit
  ## landing on master would otherwise fire this workflow twice (once
  ## for the branch push, once for the tag push). Same rationale in
  ## the other workflows in this directory.
  push:
    tags:
      - '*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest

    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name != 'pull_request'

    timeout-minutes: 7

    container:
      ## debian:trixie - Debian 13, current stable. TODO: update for
      ## forky. Re-pin procedure: agents/github-actions-security.md.
      image: debian:trixie@sha256:35b8ff74ead4880f22090b617372daff0ccae742eb5674455d542bef71ef1999  # debian:trixie as of 2026-04-27

    steps:
      - name: Install git for actions/checkout
        ## Inline because checkout has not yet run - the ci/ script
        ## would not be on disk yet. Not cached: pre-checkout step
        ## runs before the cache action (which needs the workspace
        ## for hashFiles); git's deb is small (~50 MB) so the
        ## redownload cost is negligible.
        run: |
          set -e
          cat /etc/os-release
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false

      ## debian:trixie's /etc/apt/apt.conf.d/docker-clean wipes
      ## /var/cache/apt/archives after every install; defeats the
      ## cache. Drop it and tell apt to keep the downloaded .debs
      ## so the cache action below can save them at end-of-job.
      - name: Configure apt to keep downloaded debs
        run: |
          rm -f /etc/apt/apt.conf.d/docker-clean
          printf '%s\n' 'Binary::apt::APT::Keep-Downloaded-Packages "true";' \
              > /etc/apt/apt.conf.d/keep-cache

      ## First-party actions/cache. Caches downloaded .debs so the
      ## subsequent ./ci/lint-install reuses them instead of
      ## redownloading from the Debian mirror.
      - name: Cache apt packages
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: /var/cache/apt/archives
          key: ${{ runner.os }}-apt-lint-${{ hashFiles('.github/workflows/lint.yml', 'ci/lint-install') }}
          restore-keys: |
            ${{ runner.os }}-apt-lint-

      - name: Install lint dependencies (Debian apt)
        run: ./ci/lint-install

      - name: Lint diagnostics
        run: ./ci/lint-diagnostics

      - name: Lint yaml
        run: ./ci/lint-yaml

      - name: Lint shellcheck
        run: ./ci/lint-shellcheck
